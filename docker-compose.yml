services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: techpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: techpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    container_name: techpilot-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 5000
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: techpilot
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3.5:0.8b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      OLLAMA_VISION_MODEL: llava:latest
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: techpilot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:4173"

volumes:
  postgres_data:
  backend_uploads:
